name: LiftLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  LiftKit:
    path: Packages/LiftKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0
targets:
  LiftLog:
    type: application
    platform: iOS
    scheme:
      testTargets: [LiftLogUITests]
    sources:
      - LiftLog
      - path: ../shared/programs
        buildPhase: resources
      - path: ../shared/gyms
        buildPhase: resources
      - path: ../shared/food
        buildPhase: resources
    dependencies:
      - package: LiftKit
      - package: Supabase
        product: Supabase
    entitlements:
      path: LiftLog/LiftLog.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: LiftLog/Info.plist
      properties:
        CFBundleDisplayName: LiftLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: LiftLog uses the camera to scan food barcodes.
        NSHealthShareUsageDescription: LiftLog reads your weight, height, body fat and waist size to track body composition, and daily calories, macros (e.g. from MyFitnessPal) and steps for the Food screen.
        NSHealthUpdateUsageDescription: LiftLog saves your finished workouts and logged body weight to Apple Health.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        LIFTLOG_EMAIL_LINKS: $(LIFTLOG_EMAIL_LINKS)
        CFBundleURLTypes:
          - CFBundleURLName: $(LIFTLOG_BUNDLE_ID)
            CFBundleURLSchemes: [liftlog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFTLOG_BUNDLE_ID)
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LiftLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LiftLogUITests
    dependencies:
      - target: LiftLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFTLOG_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LiftLog
        SWIFT_VERSION: 5.0
